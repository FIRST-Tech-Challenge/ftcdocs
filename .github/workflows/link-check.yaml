name: "Link Check"

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
    
jobs:
  link-check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write # cache-nix-action purges superseded Nix store caches
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 9G
          # Drop main's caches for older flake.lock hashes once a new one is
          # saved, so stale ~3 GB stores don't crowd the 10 GB repo quota.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: link-check
        run: nix develop -c make -C docs/ linkcheckdiff SPHINXOPTS="--keep-going"

      - name: Arhive Log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LINKCHECK--1
          path: docs/build/linkcheckdiff/output.json
          retention-days: 7
