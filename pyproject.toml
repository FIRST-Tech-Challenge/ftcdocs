[project]
name = "ftcdocs"
version = "0.1.0"
description = "Documentation for the FIRST Tech Challenge"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "ftcdocs-linkcheckdiff",
    "javasphinx",
    "python-git-info==0.8.3",
    "sphinx==8.2.3",
    "sphinx-autobuild==2024.2.4",
    "sphinx-design==0.7.0",
    "sphinx-hoverxref==1.3.0",
    "sphinx-notfound-page==1.1.0",
    "sphinx-rtd-dark-mode",
    "sphinx-sitemap==2.3.0",
    "sphinxcontrib-cookiebanner",
    "sphinxcontrib-googleanalytics",
    "sphinxcontrib-mermaid==0.9.2",
    "sphinxext-rediraffe==0.2.7",
]

[dependency-groups]
# required to run the scripts
scripts = ["pillow", "tqdm"]

[tool.uv]
package = false

[tool.uv.sources]
sphinx-rtd-dark-mode = { git = "https://github.com/FIRST-Tech-Challenge/ftcdocs-helper", subdirectory = "sphinx_rtd_dark_mode_v2", rev = "main" }
javasphinx = { git = "https://github.com/FIRST-Tech-Challenge/ftcdocs-helper", subdirectory = "javasphinx", rev = "main" }
sphinxcontrib-googleanalytics = { git = "https://github.com/FIRST-Tech-Challenge/ftcdocs-helper", subdirectory = "googleanalytics", rev = "main" }
sphinxcontrib-cookiebanner = { git = "https://github.com/FIRST-Tech-Challenge/ftcdocs-helper", subdirectory = "cookiebanner", rev = "main" }
ftcdocs-linkcheckdiff = { git = "https://github.com/FIRST-Tech-Challenge/ftcdocs-helper", subdirectory = "linkcheckdiff", rev = "main" }
